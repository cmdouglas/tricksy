[project]
name = "tricksy"
version = "0.1.0"
description = "Server-authoritative, asynchronous trick-taking games online. Texas 42 today."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.141.1",
    "mangum>=0.21.0",
]

[project.scripts]
tricksy = "tricksy.cli.main:main"

[project.optional-dependencies]
cli = [
    "httpx2>=2.10.0",
]
infra = [
    "aws-cdk-lib>=2.265.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
    "moto[dynamodb]>=5.0",
    "boto3-stubs[dynamodb,dynamodbstreams]>=1.35",
    "testcontainers>=4.8",
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "uvicorn>=0.52.3",
    "aws-cdk-lib>=2.265.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tricksy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -m \"not integration\""
pythonpath = ["infra"]
markers = [
    "integration: needs a real DynamoDB Local via Docker (ROADMAP.md 1.6); run with `-m integration`",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "infra"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "infra"]
strict = true
warn_unreachable = true
